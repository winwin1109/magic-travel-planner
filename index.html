<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Travel Planner</title>
    
    <!-- PWA Manifest & Theme Color & iOS Web App Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8F9E8B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Magic Travel Planner">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --theme-main: #8F9E8B;
            --theme-bg: #F4F1EA;
            --theme-accent: #6E5A4B;
            --theme-border: #B5B5B5;
            --theme-table-bg: #FFFFFF;
        }

        body { font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; background-color: #FAF9F6; color: #2C2C2C; margin: 0; padding: 20px; line-height: 1.4; transition: all 0.3s; }
        .container { max-width: 1500px; margin: 0 auto; background-color: #FFFFFF; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        /* 頁籤 */
        .tab-navigation { display: flex; border-bottom: 3px solid var(--theme-main); margin-bottom: 25px; gap: 5px; }
        .tab-btn { padding: 12px 24px; font-size: 15px; font-weight: bold; background-color: var(--theme-bg); border: 1px solid var(--theme-border); border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; color: var(--theme-accent); transition: 0.2s; }
        .tab-btn.active { background-color: var(--theme-main); color: white; border-color: var(--theme-main); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 面板與工具列 */
        .control-panel, .format-toolbar { background-color: var(--theme-bg); border: 1px solid var(--theme-border); padding: 15px 20px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .format-toolbar { background-color: #FFF3E0; border-color: #FFCC80; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .control-group { display: flex; align-items: center; gap: 8px; }
        label { font-size: 13px; font-weight: bold; color: var(--theme-accent); }
        select, input[type="text"], input[type="date"], input[type="color"] { padding: 6px 10px; border: 1px solid var(--theme-border); border-radius: 4px; font-size: 13px; background-color: #FFFFFF; }
        input[type="color"] { padding: 0; width: 35px; height: 30px; cursor: pointer; }
        
        button.action-btn, button.export-btn { color: white; border: none; padding: 7px 14px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; }
        button.action-btn { background-color: var(--theme-accent); }
        button.export-btn { background-color: #4A7C59; }
        button.action-btn:hover, button.export-btn:hover { filter: brightness(0.85); }

        /* 標題區域 */
        .title-section { text-align: center; margin-bottom: 25px; padding: 15px; }
        .main-title-editable { font-size: 48px; font-weight: 900; outline: none; margin-bottom: 10px; color: var(--theme-accent); }
        .sub-title-editable { font-size: 24px; font-weight: bold; color: #555; outline: none; }

        /* 萬用可編輯表格與卡片樣式 - 針對選取優化 */
        .editable-cell { outline: none; min-height: 40px; padding: 5px; border: 1px dashed transparent; transition: all 0.2s; border-radius: 4px; }
        .editable-cell:hover { border-color: rgba(0,0,0,0.1); background-color: rgba(0,0,0,0.02); }
        /* 正在編輯中的焦點樣式 */
        .active-editing-cell { border: 2px dashed #1976D2 !important; background-color: rgba(25, 118, 210, 0.05) !important; }

        /* 表格排版 */
        .overview-print-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background-color: var(--theme-table-bg); margin-bottom: 15px; }
        table th, table td { border: 2px solid var(--theme-border); padding: 10px; vertical-align: top; text-align: left; }
        table th { background-color: var(--theme-main); color: white; font-weight: bold; text-align: center; }
        
        /* 第一頁專屬 */
        .overview-day-cell { height: 180px; position: relative; }
        .date-label { font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #333; border-bottom: 1px solid rgba(0,0,0,0.1); padding-bottom: 3px; }
        .hotel-table th { background-color: var(--theme-accent); color: white; }

        /* 第二頁專屬 */
        .itinerary-day-block { margin-bottom: 35px; background-color: var(--theme-table-bg); border: 2px solid var(--theme-border); border-radius: 8px; padding: 15px; page-break-inside: avoid; }
        .itinerary-day-title { font-size: 18px; font-weight: bold; color: white; background-color: var(--theme-accent); padding: 10px 15px; margin: -15px -15px 15px -15px; border-radius: 6px 6px 0 0; }
        .itinerary-table th { background-color: var(--theme-bg); color: var(--theme-accent); }
        .reference-section { background-color: rgba(0,0,0,0.02); border: 1px dashed var(--theme-border); padding: 15px; border-radius: 4px; }

        /* 第三頁 Checklist */
        .checklist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .checklist-card { background-color: var(--theme-table-bg); border: 2px solid var(--theme-border); border-radius: 8px; padding: 15px; page-break-inside: avoid; }
        .checklist-category-title { font-size: 16px; font-weight: bold; color: var(--theme-accent); border-bottom: 2px solid var(--theme-main); padding-bottom: 6px; margin-top: 0; margin-bottom: 12px; display: flex; justify-content: space-between; }
        .checklist-item-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; position: relative; }
        .checklist-item-row:hover .delete-item-btn { display: inline-block; }
        .delete-item-btn { display: none; background: #FFCDD2; color: #C62828; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; line-height: 18px; text-align: center; padding: 0; margin-top: 2px; }

        /* 輔助工具 */
        .emoji-bar, .template-bar { display: flex; flex-wrap: wrap; gap: 5px; background: #FFFFFF; padding: 8px; border-radius: 4px; border: 1px solid var(--theme-border); margin-bottom: 10px; align-items: center; }
        .emoji-item { font-size: 18px; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: 0.1s; }
        .emoji-item:hover { background-color: var(--theme-bg); }
        .template-btn { background-color: #E8F0FE; color: #1A73E8; border: 1px solid #D2E3FC; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* 列印與匯出 */
        .no-print { display: block; }
        @media print {
            .no-print, .no-print * { display: none !important; }
            body { background-color: #FFFFFF !important; padding: 0 !important; margin: 0 !important; }
            .container { box-shadow: none !important; padding: 0 !important; max-width: 100% !important; }
            table { table-layout: fixed !important; width: 100% !important; }
            .overview-day-cell { height: auto !important; min-height: 120px !important; }
            .active-editing-cell { border: 1px dashed transparent !important; background-color: transparent !important; }
            .tab-content { display: none !important; }
            .tab-content.active { display: block !important; }
        }
    </style>
</head>
<body>

<input type="file" id="imageUploader" style="display:none;" accept="image/*" onchange="handleImageUpload(event)">

<div class="container">
    
    <div class="control-panel no-print">
        <div class="control-group">
            <label>1. 整體風格主題：</label>
            <select onchange="applyTheme(this.value)">
                <option value="default">預設粉彩 (Default)</option>
                <option value="monochrome">簡約黑白 (Monochrome)</option>
                <option value="playful">活潑童趣 (Playful)</option>
                <option value="forest">森林大地 (Forest)</option>
                <option value="ocean">海洋微風 (Ocean)</option>
                <option value="artistic" style="font-weight:bold; color:#A93226;">藝術油畫 (Artistic)</option>
                <option value="fashion" style="font-weight:bold; color:#D4AC0D;">摩登時尚 (Fashion)</option>
                <option value="morandi" style="font-weight:bold; color:#873600;">莫蘭迪美學 (Morandi)</option>
            </select>
        </div>
        <div class="control-group" style="background:#FFF3E0; padding:5px 10px; border-radius:5px; border:1px solid #FFCC80;">
            <label>2. 旅途區間：</label>
            <input type="date" id="baseStartDate" value="2026-04-29" onchange="recalculateDates()">
            <span style="font-size:13px; font-weight:bold; color:var(--theme-accent);">至</span>
            <input type="date" id="baseEndDate" value="2026-05-04" onchange="recalculateDates()">
        </div>
        <div class="control-group">
            <label>主標題漸層色：</label>
            <select onchange="applyTitleGradient(this.value)">
                <option value="none">無漸層</option>
                <option value="linear-gradient(45deg, #FF512F, #DD2476)">晚霞紅紫</option>
                <option value="linear-gradient(45deg, #1CB5E0, #000851)">深海冰藍</option>
                <option value="linear-gradient(45deg, #11998e, #38ef7d)">森林翠綠</option>
                <option value="linear-gradient(45deg, #C0392B, #8E44AD)">藝術油彩</option>
                <option value="linear-gradient(45deg, #D4AF37, #111111)">時尚黑金</option>
            </select>
        </div>
        <div class="control-group">
            <label>副標題顏色：</label>
            <input type="color" value="#555555" onchange="document.getElementById('displaySubTitle').style.color = this.value">
        </div>
        <div class="control-group" style="margin-left: auto; background: #fff; padding: 5px; border-radius: 5px; border: 1px solid #ddd; display: flex; gap: 5px;">
            <button class="export-btn" style="background-color: #D32F2F;" onclick="resetPlanner()">🔄 重新整理清空</button>
            <button class="export-btn" style="background-color: #00897B;" onclick="saveToLocal()">💾 儲存至 App</button>
            <select id="exportPageSize">
                <option value="a3-portrait">A3 縱向匯出</option>
                <option value="a4-portrait">A4 縱向匯出</option>
                <option value="a4-landscape">A4 橫向匯出</option>
            </select>
            <button class="export-btn" onclick="triggerPDFExport()">📥 PDF</button>
            <button class="export-btn" style="background-color: #2B579A;" onclick="triggerWordExport()">📥 WORD</button>
        </div>
    </div>

    <div class="format-toolbar no-print">
        <label style="color: #E65100; font-size: 15px;">🖍️ 獨立內容格式區：</label>
        <span style="font-size: 13px; color: #555;">(請先點擊下方任意「文字格」，再使用此處工具)</span>
        
        <div style="border-left: 2px solid #FFCC80; padding-left: 15px; display: flex; gap: 10px; align-items: center;">
            <label>文字顏色:</label>
            <input type="color" id="cellTextColorPicker" onchange="modifyActiveCell('color', this.value)">
            
            <label>字體大小:</label>
            <select onchange="modifyActiveCell('fontSize', this.value)">
                <option value="">預設</option>
                <option value="12px">12px (極小)</option>
                <option value="14px">14px (標準)</option>
                <option value="16px">16px (稍微放大)</option>
                <option value="18px">18px (大)</option>
                <option value="20px">20px (特大)</option>
                <option value="24px">24px (標題級)</option>
                <option value="30px">30px (巨無霸)</option>
            </select>

            <label>獨立字體:</label>
            <select onchange="modifyActiveCell('fontFamily', this.value)">
                <option value="">還原預設字體</option>
                <option value="'ZCOOL KuaiLe', sans-serif">快樂童趣體</option>
                <option value="'Ma Shan Zheng', cursive">手寫隨性體</option>
                <option value="'ZCOOL XiaoWei', serif">優雅文藝體</option>
                <option value="'Arial Rounded MT Bold', sans-serif">微軟圓體</option>
            </select>
            
            <button class="action-btn" style="background-color: #EF6C00;" onclick="toggleActiveCellWeight()"><b>粗體切換</b></button>
            <button class="action-btn" style="background-color: #EF6C00;" onclick="toggleActiveCellStyle()"><i>斜體切換</i></button>
        </div>
    </div>

    <div class="tab-navigation no-print">
        <button class="tab-btn active" id="btn-page1" onclick="switchActiveTab('page1')">第一頁：表格式行程總覽</button>
        <button class="tab-btn" id="btn-page2" onclick="switchActiveTab('page2')">第二頁：每日詳細行程表</button>
        <button class="tab-btn" id="btn-page3" onclick="switchActiveTab('page3')">第三頁：行李與物品 Check List</button>
    </div>

    <div id="dynamic-planner-core">
        
        <div class="title-section" id="print-title-area">
            <div id="displayMainTitle" class="main-title-editable" contenteditable="true">Magic Travel Planner</div>
            <div id="displaySubTitle" class="sub-title-editable" contenteditable="true">在此輸入您的專屬行程副標題...</div>
        </div>

        <div id="tab-page1" class="tab-content active">
            <div class="no-print" style="margin-bottom: 15px;">
                <div class="emoji-bar">
                    <label>快速貼上工具 (先點格子再點按鈕)：</label>
                    <span id="emojiList">
                        <span class="emoji-item" onclick="insertHtmlToFocused('🚗')">🚗</span>
                        <span class="emoji-item" onclick="insertHtmlToFocused('✈️')">✈️</span>
                        <span class="emoji-item" onclick="insertHtmlToFocused('🏨')">🏨</span>
                        <span class="emoji-item" onclick="insertHtmlToFocused('🍱')">🍱</span>
                        <span class="emoji-item" onclick="insertHtmlToFocused('📸')">📸</span>
                        <span class="emoji-item" onclick="insertHtmlToFocused('♨️')">♨️</span>
                    </span>
                    
                    <span class="custom-emoji-adder no-print" style="margin-left: 5px; display: inline-flex; align-items: center; gap: 5px; border-left: 1px solid #ccc; padding-left: 10px;">
                        <input type="text" id="customEmojiInput" placeholder="自訂文字/圖示" style="width: 100px; padding: 4px; font-size: 13px;">
                        <button class="action-btn" style="padding: 4px 8px; font-size: 12px; background-color: var(--theme-main);" onclick="addCustomEmoji()">+ 新增工具</button>
                    </span>
                    
                    <span style="margin-left: auto; display: flex; align-items: center; gap: 5px;">
                        <label>獨立更改此格背景色：</label>
                        <select onchange="modifyActiveCell('backgroundColor', this.value)">
                            <option value="transparent">預設透明</option>
                            <option value="#E8F5E9">粉綠色</option>
                            <option value="#FFE0B2">粉橙色</option>
                            <option value="#E1BEE7">粉紫色</option>
                            <option value="#E3F2FD">粉藍色</option>
                            <option value="#FFEBEE">粉紅色</option>
                            <option value="#FFF9C4">淺黃色</option>
                        </select>
                    </span>
                </div>
                <div class="template-bar">
                    <button class="template-btn" onclick="insertHtmlToFocused('<br><br>✈️ 出發航班<br>Flight: <br>00:00 - 00:00')">＋ 貼上去程航班</button>
                    <button class="template-btn" onclick="insertHtmlToFocused('<br><br>✈️ 回程航班<br>Flight: <br>00:00 - 00:00')">＋ 貼上回程航班</button>
                    <button class="template-btn" style="background-color: #E2F2E4; color: #2E7D32; border-color: #C8E6C9;" onclick="insertHtmlToFocused('<br><br>🚗 租車預約<br>單號: ')">＋ 租車預約</button>
                </div>
            </div>

            <div class="overview-print-wrapper">
                <table id="mainOverviewTable">
                    <thead>
                        <tr><th style="width: 14.28%;">星期日</th><th style="width: 14.28%;">星期一</th><th style="width: 14.28%;">星期二</th><th style="width: 14.28%;">星期三</th><th style="width: 14.28%;">星期四</th><th style="width: 14.28%;">星期五</th><th style="width: 14.28%;">星期六</th></tr>
                    </thead>
                    <tbody id="overviewTableBody"></tbody>
                </table>
            </div>

            <div class="hotel-row-section" style="margin-top: 25px;">
                <h3 style="font-size: 16px; margin-bottom: 8px; display: flex; justify-content: space-between;">
                    <span>🏨 住宿飯店對照明細 
                        <button class="action-btn no-print" style="margin-left:10px; background-color: var(--theme-main); padding: 4px 8px; font-size: 11px;" onclick="updateHotelDates()">🔄 手動同步入住日期</button>
                        <span style="font-size:12px; color:#666; font-weight:normal; margin-left:8px;">(修改天數後，點此重算區間)</span>
                    </span>
                    <button class="action-btn no-print" onclick="addNewHotelRow()">+ 新增酒店列</button>
                </h3>
                <table class="hotel-table">
                    <thead><tr><th style="width: 15%;">天數 (可編輯數字)</th><th style="width: 25%;">入住區間 (自動計算)</th><th style="width: 50%;">酒店資訊</th><th style="width: 10%;" class="no-print">操作</th></tr></thead>
                    <tbody id="hotelTableBody">
                        <tr><td><div class="editable-cell" contenteditable="true">1 Day</div></td><td><div class="editable-cell" contenteditable="true">YYYY/MM/DD</div></td><td><div class="editable-cell" contenteditable="true">點此輸入飯店名稱...</div></td><td class="no-print" style="text-align:center;"><button class="action-btn" style="background-color:#D32F2F;" onclick="this.parentElement.parentElement.remove(); updateHotelDates();">刪除</button></td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div id="tab-page2" class="tab-content">
            <div class="no-print" style="margin-bottom: 15px; padding: 10px; background: #E3F2FD; border-radius: 6px; border: 1px solid #90CAF9;">
                <label>📸 行程表相片上傳：</label>
                <button class="action-btn" style="background-color: #1976D2;" onclick="triggerImageUpload()">
                    先點選下方表格，再按此上傳相片
                </button>
            </div>
            <div id="detailedItineraryContainer"></div>
        </div>

        <div id="tab-page3" class="tab-content">
            <div class="no-print" style="margin-bottom: 15px;">
                <input type="text" id="newCategoryName" placeholder="輸入新分類名稱...">
                <button class="action-btn" onclick="addChecklistCategory()">➕ 建立新分類卡片</button>
                <span style="font-size: 13px; color: #666; margin-left: 10px;">(若要單頁滿版，請在最上方匯出設定選擇「A4橫向」)</span>
            </div>
            <div class="checklist-grid" id="checklistGridContainer"></div>
        </div>

    </div>
</div>

<script>
    // PWA Service Worker Registration
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(registration => console.log('ServiceWorker 註冊成功'))
          .catch(err => console.log('ServiceWorker 註冊失敗: ', err));
      });
    }

    const themes = {
        default: { '--theme-main': '#8F9E8B', '--theme-bg': '#F4F1EA', '--theme-accent': '#6E5A4B', '--theme-border': '#B5B5B5', '--theme-table-bg': '#FFFFFF' },
        monochrome: { '--theme-main': '#444444', '--theme-bg': '#F0F0F0', '--theme-accent': '#000000', '--theme-border': '#000000', '--theme-table-bg': '#FFFFFF' },
        playful: { '--theme-main': '#FF96A5', '--theme-bg': '#FFF0F5', '--theme-accent': '#D81B60', '--theme-border': '#FFB6C1', '--theme-table-bg': '#FFFDFD' },
        forest: { '--theme-main': '#2E8B57', '--theme-bg': '#E8F5E9', '--theme-accent': '#1B5E20', '--theme-border': '#81C784', '--theme-table-bg': '#F1F8E9' },
        ocean: { '--theme-main': '#00ACC1', '--theme-bg': '#E0F7FA', '--theme-accent': '#006064', '--theme-border': '#4DD0E1', '--theme-table-bg': '#F2FBFD' },
        artistic: { '--theme-main': '#2C3E50', '--theme-bg': '#F4F1EA', '--theme-accent': '#A93226', '--theme-border': '#85929E', '--theme-table-bg': '#FFFFFF' },
        fashion: { '--theme-main': '#111111', '--theme-bg': '#F9F9F9', '--theme-accent': '#D4AC0D', '--theme-border': '#CCCCCC', '--theme-table-bg': '#FFFFFF' },
        morandi: { '--theme-main': '#B2BABB', '--theme-bg': '#F5EEF8', '--theme-accent': '#873600', '--theme-border': '#D5DBDB', '--theme-table-bg': '#FDEDEC' }
    };

    // 清空為預設空陣列，作為乾淨的模板
    const presetItineraryTexts = [];

    // 還原為最原始超詳細的 Check List 內容
    const fullChecklistData = {
        "證件": ["身份證", "特區護照", "證件COPIES", "機票", "行程表", "日文上課書X1", "旅遊書X1", "國際駕駛執照", "日本交通卡X2"],
        "攝影工具": ["相機X2(大小各一)", "DJI pocket3", "360CAM", "DJI NEO"],
        "攝影輔助工具": ["三腳架大", "神棍", "後備電池X3", "相機雨衣", "車用手機架"],
        "充電器": ["相機", "DJI/NEO/360CAM線", "手機X3", "WIFI充電", "I PAD充電", "牙刷充電", "鬚刨充電", "充電尿袋X2"],
        "轉換插頭": ["2個多頭", "多功能插X2"],

    let activeCell = null;
    let currentActiveTab = 'page1';

    window.onload = function() {
        // 先嘗試從 LocalStorage 載入資料
        const loaded = loadFromLocal();
        
        // 如果沒有儲存過的資料，才載入預設畫面
        if (!loaded) {
            recalculateDates();
            renderChecklist();
        }
        
        document.addEventListener('click', function(e) {
            if(e.target.closest('.editable-cell') || e.target.classList.contains('editable-cell')) {
                document.querySelectorAll('.editable-cell').forEach(c => c.classList.remove('active-editing-cell'));

                activeCell.classList.add('active-editing-cell');
                
                let currentColor = rgb2hex(activeCell.style.color);

                    document.getElementById('cellTextColorPicker').value = currentColor;

    // ==================== LocalStorage 儲存與讀取邏輯 ====================
    function saveToLocal() {
        clearActiveCellOutline();
        
        // 將動態表單元素狀態寫入 HTML 屬性
        document.querySelectorAll('#dynamic-planner-core input').forEach(input => {
            if (input.type === 'text' || input.type === 'date' || input.type === 'color') {
                input.setAttribute('value', input.value);
            } else if (input.type === 'checkbox' || input.type === 'radio') {
                if (input.checked) input.setAttribute('checked', 'checked');
                else input.removeAttribute('checked');
            }
        });
        document.querySelectorAll('#dynamic-planner-core select').forEach(select => {
            Array.from(select.options).forEach(opt => {
                if (opt.selected) opt.setAttribute('selected', 'selected');
                else opt.removeAttribute('selected');
            });
        });

        const saveData = {
            plannerHTML: document.getElementById('dynamic-planner-core').innerHTML,
            theme: document.querySelector('select[onchange="applyTheme(this.value)"]').value,
            startDate: document.getElementById('baseStartDate').value,
            endDate: document.getElementById('baseEndDate').value,
            titleGradient: document.querySelector('select[onchange="applyTitleGradient(this.value)"]').value,
            activeTab: currentActiveTab
        };
        
        localStorage.setItem('magicPlannerData', JSON.stringify(saveData));
        alert("🎉 進度已成功儲存至設備！\n下次打開此 App 時，將會自動還原您目前的內容。");
    }

    function loadFromLocal() {
        const savedDataStr = localStorage.getItem('magicPlannerData');
        if (savedDataStr) {
            try {
                const savedData = JSON.parse(savedDataStr);
                document.getElementById('dynamic-planner-core').innerHTML = savedData.plannerHTML;
                
                // 還原控制面板狀態
                if (savedData.theme) {
                    document.querySelector('select[onchange="applyTheme(this.value)"]').value = savedData.theme;
                    applyTheme(savedData.theme);
                }
                if (savedData.startDate) document.getElementById('baseStartDate').value = savedData.startDate;
                if (savedData.endDate) document.getElementById('baseEndDate').value = savedData.endDate;
                if (savedData.titleGradient) {
                    document.querySelector('select[onchange="applyTitleGradient(this.value)"]').value = savedData.titleGradient;
                }
                if (savedData.activeTab) {
                    switchActiveTab(savedData.activeTab);
                }
                
                // 還原副標題顏色選取器狀態
                const subTitle = document.getElementById('displaySubTitle');
                if (subTitle && subTitle.style.color) {
                    document.querySelector('input[type="color"][onchange*="displaySubTitle"]').value = rgb2hex(subTitle.style.color);
                }
                return true;
            } catch (e) {
                console.error("載入失敗", e);
                return false;
            }
        }
        return false;
    }

    function resetPlanner() {
        if(confirm("⚠️ 確定要清空所有行程並還原為初始的空白狀態嗎？\n(注意：儲存過的內容將會永久遺失！)")) {
            localStorage.removeItem('magicPlannerData');
            location.reload();
        }
    }
    // ===================================================================

    function rgb2hex(rgb) {
        if (!rgb || rgb.indexOf("rgb") === -1) return "#2c2c2c";
        rgb = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
        function hex(x) { return ("0" + parseInt(x).toString(16)).slice(-2); }
        return rgb ? "#" + hex(rgb[1]) + hex(rgb[2]) + hex(rgb[3]) : "#2c2c2c";
    }

    function modifyActiveCell(styleProperty, value) {
        if (!activeCell) { alert('💡 請先點擊下方的任何一段文字格子 (會出現藍色虛線框)，再來使用此排版工具！'); return; }
        activeCell.style[styleProperty] = value;
    }

    function toggleActiveCellWeight() {
        if (!activeCell) return alert('請先點擊要修改的文字格子！');
        activeCell.style.fontWeight = (activeCell.style.fontWeight === 'bold') ? 'normal' : 'bold';
    }

    function toggleActiveCellStyle() {
        if (!activeCell) return alert('請先點擊要修改的文字格子！');
        activeCell.style.fontStyle = (activeCell.style.fontStyle === 'italic') ? 'normal' : 'italic';
    }

    function recalculateDates() {
        const startInputStr = document.getElementById('baseStartDate').value || '2026-04-29';
        const endInputStr = document.getElementById('baseEndDate').value || '2026-05-04';
        
        let tripStartDate = new Date(startInputStr);
        let tripEndDate = new Date(endInputStr);
        
        // Ensure end date is not before start date
        if (tripEndDate < tripStartDate) {
            tripEndDate = new Date(tripStartDate);
            tripEndDate.setDate(tripStartDate.getDate() + 5); 
            document.getElementById('baseEndDate').value = tripEndDate.toISOString().split('T')[0];
        }

        let diffTime = tripEndDate.getTime() - tripStartDate.getTime();
        let totalDays = Math.round(diffTime / (1000 * 3600 * 24)) + 1;
        
        const dayOfWeek = tripStartDate.getDay();
        const calendarStartDate = new Date(tripStartDate);
        calendarStartDate.setDate(tripStartDate.getDate() - dayOfWeek);

        const tbody = document.getElementById('overviewTableBody');
        tbody.innerHTML = '';
        let row = document.createElement('tr');
        
        let totalCellsNeeded = dayOfWeek + totalDays;
        let weeksToShow = Math.max(2, Math.ceil(totalCellsNeeded / 7));
        let totalCells = weeksToShow * 7;
        
        for(let i = 0; i < totalCells; i++) {
            if (i > 0 && i % 7 === 0) { tbody.appendChild(row); row = document.createElement('tr'); }
            
            let currentCellDate = new Date(calendarStartDate);
            currentCellDate.setDate(calendarStartDate.getDate() + i);
            
            let m = currentCellDate.getMonth() + 1;
            let d = currentCellDate.getDate();
            let dateLabel = `${m}/${d}`;

            let cellDiffTime = currentCellDate.getTime() - tripStartDate.getTime();
            let diffDays = Math.round(cellDiffTime / (1000 * 3600 * 24));
            
            let cellContent = "";
            let bgColor = "transparent";
            
            if (diffDays >= 0 && diffDays < totalDays) {
                let presetText = presetItineraryTexts[diffDays] || `(第 ${diffDays + 1} 天行程)\n點此輸入內容...`;
                cellContent = presetText.replace(/\n/g, '<br>');
                
                const pastelColors = ["#FFF9C4", "#E8F5E9", "#E1BEE7", "#E3F2FD", "#FFEBEE"];
                bgColor = pastelColors[diffDays % 5];
            }

            const td = document.createElement('td');
            td.className = 'overview-day-cell';
            td.style.backgroundColor = bgColor;
            td.innerHTML = `<div class="date-label">${dateLabel}</div><div class="cell-content editable-cell" contenteditable="true">${cellContent}</div>`;
            row.appendChild(td);
        }
        tbody.appendChild(row);

        const itineraryContainer = document.getElementById('detailedItineraryContainer');
        itineraryContainer.innerHTML = '';
        const weekdaysText = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

        for(let j = 0; j < totalDays; j++) {
            let detailDate = new Date(tripStartDate);
            detailDate.setDate(tripStartDate.getDate() + j);
            let y = detailDate.getFullYear();
            let m = detailDate.getMonth() + 1;
            let d = detailDate.getDate();
            let w = weekdaysText[detailDate.getDay()];
            let fullDateStr = `${y}/${m}/${d} (${w})`;

            let titleContent = presetItineraryTexts[j] ? presetItineraryTexts[j].split('\n')[0].replace('★ ', '') : '點此輸入行程景點...';

            itineraryContainer.innerHTML += `
                <div class="itinerary-day-block">
                    <div class="itinerary-day-title">📆 ${fullDateStr} - 第 ${j+1} 天詳細行程</div>
                    <table class="itinerary-table">
                        <tr><th width="15%">時間</th><th width="35%">行程與景點</th><th width="15%">交通</th><th width="15%">住宿</th><th width="20%">備註</th></tr>
                        <tr>
                            <td><div class="editable-cell" contenteditable="true" style="font-weight:bold;">09:00 AM</div></td>
                            <td><div class="editable-cell" contenteditable="true">${titleContent}</div></td>
                            <td><div class="editable-cell" contenteditable="true">點此輸入交通...</div></td>
                            <td><div class="editable-cell" contenteditable="true">飯店名稱</div></td>
                            <td><div class="editable-cell" contenteditable="true">輸入筆記</div></td>
                        </tr>
                    </table>
                    <div class="reference-section"><div class="editable-cell" contenteditable="true">📂 參考資料與相片擴充區 (點擊此處後，使用上方「插入相片」按鈕上傳照片)...</div></div>
                </div>`;
        }
        
        updateHotelDates();
    }

    function updateHotelDates() {
        const startInputStr = document.getElementById('baseStartDate').value || '2026-04-29';
        const startDate = new Date(startInputStr);
        const rows = document.querySelectorAll('#hotelTableBody tr');
        let currentDate = new Date(startDate);

        rows.forEach(row => {
            const daysCell = row.cells[0].querySelector('.editable-cell');
            const datesCell = row.cells[1].querySelector('.editable-cell');
            
            let match = daysCell.innerText.match(/\d+/);
            let days = match ? parseInt(match[0]) : 1;
            
            let startStr = `${currentDate.getFullYear()}/${(currentDate.getMonth()+1).toString().padStart(2, '0')}/${currentDate.getDate().toString().padStart(2, '0')}`;
            
            currentDate.setDate(currentDate.getDate() + days);
            
            let endStr = `${(currentDate.getMonth()+1).toString().padStart(2, '0')}/${currentDate.getDate().toString().padStart(2, '0')}`;
            
            if(days === 1) {
                datesCell.innerText = `${startStr}`;
            } else {
                datesCell.innerText = `${startStr} ~ ${endStr}`;
            }
        });
    }

    function applyTheme(themeName) {
        const root = document.documentElement;
        for (const [prop, val] of Object.entries(themes[themeName])) root.style.setProperty(prop, val);
    }

    function applyTitleGradient(gradientValue) {
        const titleEl = document.getElementById('displayMainTitle');
        if (gradientValue === 'none') {
            titleEl.style.backgroundImage = 'none';
            titleEl.style.webkitBackgroundClip = 'initial';
            titleEl.style.webkitTextFillColor = 'initial';
            titleEl.style.color = 'var(--theme-accent)';
        } else {
            titleEl.style.backgroundImage = gradientValue;
            titleEl.style.webkitBackgroundClip = 'text';
            titleEl.style.webkitTextFillColor = 'transparent';
        }
    }

    function switchActiveTab(tabId) {
        currentActiveTab = tabId;
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(`tab-${tabId}`).classList.add('active');
        document.getElementById(`btn-${tabId}`).classList.add('active');
    }

    function insertHtmlToFocused(html) {
        if(activeCell) activeCell.innerHTML += html;
        else alert('請先點擊要貼上的格子！');
    }

    function triggerImageUpload() {
        if (!activeCell) return alert('請先點選下方表格內要放置相片的格子！');
        document.getElementById('imageUploader').click();
    }

    function handleImageUpload(event) {
        const file = event.target.files[0];
        if (file && activeCell) {
            const reader = new FileReader();
            reader.onload = function(e) {
                activeCell.innerHTML += `<br><img src="${e.target.result}" style="max-width:100%; max-height: 250px; border-radius:4px; margin-top:5px; border:1px solid #ccc;"/><br>`;
            };
            reader.readAsDataURL(file);
        }
        event.target.value = ''; 
    }

    function renderChecklist() {
        const container = document.getElementById('checklistGridContainer');
        container.innerHTML = '';
        for (const [cat, items] of Object.entries(fullChecklistData)) appendCategoryCard(container, cat, items);
    }

    function appendCategoryCard(container, categoryName, itemsArray) {
        let itemsHtml = itemsArray.map(item => `
            <li class="checklist-item-row">
                <input type="checkbox">
                <span class="editable-cell" contenteditable="true" style="flex-grow:1; min-height:20px;">${item}</span>
                <button class="delete-item-btn no-print" onclick="this.parentElement.remove()">✖</button>
            </li>
        `).join('');
        
        container.innerHTML += `
            <div class="checklist-card">
                <h4 class="checklist-category-title">
                    <span>📋 <span class="editable-cell" contenteditable="true">${categoryName}</span></span>
                    <button class="action-btn no-print" style="padding:2px 6px; font-size:11px; background-color:#D32F2F;" onclick="this.closest('.checklist-card').remove()">刪除</button>
                </h4>
                <ul style="list-style:none; padding:0; margin:0;">${itemsHtml}</ul>
                <div class="checklist-add-item-form no-print">
                    <input type="text" placeholder="新增物品項目..." style="flex-grow:1;">
                    <button class="action-btn" onclick="addChecklistItem(this)">＋ 新增</button>
                </div>
            </div>`;
    }

    function addChecklistItem(btn) {
        const text = btn.previousElementSibling.value.trim();
        if(text) {
            btn.closest('.checklist-card').querySelector('ul').insertAdjacentHTML('beforeend', `<li class="checklist-item-row"><input type="checkbox"><span class="editable-cell" contenteditable="true" style="flex-grow:1;">${text}</span><button class="delete-item-btn no-print" onclick="this.parentElement.remove()">✖</button></li>`);
            btn.previousElementSibling.value = '';
        }
    }

    function addChecklistCategory() {
        const input = document.getElementById('newCategoryName');
        const catName = input.value.trim();
        if (catName) { appendCategoryCard(document.getElementById('checklistGridContainer'), catName, ["點此編輯新項目"]); input.value = ''; }
    }

    function addNewHotelRow() {
        document.getElementById('hotelTableBody').insertAdjacentHTML('beforeend', `<tr><td><div class="editable-cell" contenteditable="true">1 Day</div></td><td><div class="editable-cell" contenteditable="true">YYYY/MM/DD</div></td><td><div class="editable-cell" contenteditable="true">點此輸入飯店名稱...</div></td><td class="no-print" style="text-align:center;"><button class="action-btn" style="background-color:#D32F2F;" onclick="this.parentElement.parentElement.remove(); updateHotelDates();">刪除</button></td></tr>`);
        updateHotelDates();
    }

    function addCustomEmoji() {
        const input = document.getElementById('customEmojiInput');
        const val = input.value.trim();
        if (val) {
            const list = document.getElementById('emojiList');
            const newSpan = document.createElement('span');
            newSpan.className = 'emoji-item';
            newSpan.textContent = val;
            newSpan.onclick = function() { insertHtmlToFocused(val); };
            list.appendChild(newSpan);
            input.value = '';
        }
    }

    // ==================== 匯出與表格狀滿版壓縮核心邏輯 ====================
    function clearActiveCellOutline() {
        document.querySelectorAll('.editable-cell').forEach(c => c.classList.remove('active-editing-cell'));
    }

    function triggerPDFExport() {
        clearActiveCellOutline();
        const elementToExport = document.getElementById('dynamic-planner-core').cloneNode(true);
        
        elementToExport.querySelectorAll('.no-print').forEach(el => el.remove());
        elementToExport.querySelectorAll('.tab-content').forEach(tab => { if (!tab.classList.contains('active')) tab.remove(); });

        const sizeSetting = document.getElementById('exportPageSize').value;
        let targetSize = 'a4';
        let targetOrientation = 'portrait';
        
        if (sizeSetting === 'a3-portrait') { targetSize = 'a3'; targetOrientation = 'portrait'; }
        else if (sizeSetting === 'a4-portrait') { targetSize = 'a4'; targetOrientation = 'portrait'; }
        else if (sizeSetting === 'a4-landscape') { targetSize = 'a4'; targetOrientation = 'landscape'; }

        if (currentActiveTab === 'page3') {
            const grid = elementToExport.querySelector('.checklist-grid');
            if (grid) {
                grid.style.display = 'block';
                grid.style.columnCount = targetOrientation === 'landscape' ? '4' : '3';
                grid.style.columnGap = '5px';

                elementToExport.querySelectorAll('.checklist-card').forEach(c => {
                    c.style.display = 'inline-block'; 
                    c.style.width = '100%';
                    c.style.boxSizing = 'border-box';
                    c.style.padding = '4px 6px'; 
                    c.style.marginBottom = '5px'; 
                    c.style.border = '1px solid #555'; 
                    c.style.borderRadius = '0'; 
                });
                
                elementToExport.querySelectorAll('.checklist-category-title').forEach(t => { 
                    t.style.fontSize = '13px'; 
                    t.style.marginBottom = '2px'; 
                    t.style.paddingBottom = '2px';
                    t.style.borderBottom = '1px solid #555';
                });
                
                elementToExport.querySelectorAll('.checklist-item-row').forEach(r => { 
                    r.style.fontSize = '11px'; 
                    r.style.marginBottom = '0px'; 
                    r.style.lineHeight = '1.1'; 
                });

                elementToExport.querySelectorAll('.editable-cell').forEach(cell => {
                    cell.style.padding = '0px';
                    cell.style.minHeight = '14px';
                });

                const titleArea = elementToExport.querySelector('#print-title-area');
                if (titleArea) {
                    titleArea.style.padding = '2px';
                    titleArea.style.marginBottom = '4px';
                    const mainTitle = titleArea.querySelector('.main-title-editable');
                    const subTitle = titleArea.querySelector('.sub-title-editable');
                    if (mainTitle) { mainTitle.style.fontSize = '20px'; mainTitle.style.marginBottom = '2px'; }
                    if (subTitle) { subTitle.style.fontSize = '12px'; }
                }
            }
        }

        const opt = { 
            margin: [10, 10, 10, 10], 
            filename: `MagicTravelPlanner_${currentActiveTab}.pdf`, 
            image: { type: 'jpeg', quality: 0.98 }, 
            html2canvas: { scale: 2, useCORS: true }, 
            jsPDF: { unit: 'mm', format: targetSize, orientation: targetOrientation } 
        };
        html2pdf().set(opt).from(elementToExport).save();
    }

    function triggerWordExport() {
        clearActiveCellOutline();
        const clone = document.getElementById('dynamic-planner-core').cloneNode(true);
        clone.querySelectorAll('.no-print').forEach(el => el.remove());
        clone.querySelectorAll('.tab-content').forEach(tab => { if (!tab.classList.contains('active')) tab.remove(); });

        const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');

        const blobContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
            <meta charset='utf-8'>
            <title>Export</title>
            ${styles}
            <style>
                table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                th, td { border: 1px solid #B5B5B5; padding: 8px; text-align: left; vertical-align: top; }
                th { background-color: #8F9E8B; color: white; font-weight: bold; }
                .itinerary-day-title { background-color: #6E5A4B; color: white; padding: 10px; font-weight: bold; font-size: 16px; margin-bottom: 5px; }
                .checklist-card { border: 1px solid #B5B5B5; margin-bottom: 15px; padding: 10px; }
                .checklist-category-title { border-bottom: 2px solid #8F9E8B; color: #6E5A4B; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
                .checklist-item-row { margin-bottom: 5px; }
                body { font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; }
            </style>
        </head>
        <body>${clone.innerHTML}</body>
        </html>`;
        
        const blob = new Blob(['\ufeff' + blobContent], { type: 'application/msword' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `MagicTravelPlanner_${currentActiveTab}.doc`;
        document.body.appendChild(a); 
        a.click(); 
        document.body.removeChild(a);
    }
