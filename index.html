<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Travel Planner</title>
    
    <!-- PWA Manifest & Theme Color & iOS Web App Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8F9E8B">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Magic Travel Planner">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --theme-main: #7C9082;
            --theme-bg: #F7F5F0;
            --theme-accent: #5C5346;
            --theme-border: #DCD7CC;
            --theme-table-bg: #FFFFFF;
        }

        body { font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; background-color: #FAF9F6; color: #2C2C2C; margin: 0; padding: 20px; line-height: 1.4; transition: all 0.3s; }
        .container { max-width: 1500px; margin: 0 auto; background-color: #FFFFFF; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }
        
        /* 頁籤 - 舒適自然配色 */
        .tab-navigation { display: flex; border-bottom: 2px solid var(--theme-border); margin-bottom: 25px; gap: 6px; }
        .tab-btn { padding: 12px 24px; font-size: 15px; font-weight: bold; background-color: transparent; border: 1px solid transparent; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer; color: #777; transition: 0.2s; }
        .tab-btn:hover { background-color: var(--theme-bg); color: var(--theme-accent); }
        .tab-btn.active { background-color: var(--theme-bg); color: var(--theme-accent); border-color: var(--theme-border); border-bottom: 3px solid var(--theme-main); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 面板與工具列 */
        .control-panel, .format-toolbar { background-color: var(--theme-bg); border: 1px solid var(--theme-border); padding: 15px 20px; border-radius: 6px; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 15px; align-items: center; }
        .format-toolbar { background-color: #FCF8F2; border-color: #E6DEC8; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .control-group { display: flex; align-items: center; gap: 8px; }
        label { font-size: 13px; font-weight: bold; color: var(--theme-accent); }
        select, input[type="text"], input[type="date"], input[type="color"] { padding: 6px 10px; border: 1px solid var(--theme-border); border-radius: 4px; font-size: 13px; background-color: #FFFFFF; color: #333; }
        input[type="color"] { padding: 0; width: 35px; height: 30px; cursor: pointer; }
        
        button.action-btn, button.export-btn { color: white; border: none; padding: 7px 14px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        button.action-btn { background-color: var(--theme-main); }
        button.export-btn { background-color: #5A8F76; }
        button.action-btn:hover, button.export-btn:hover { filter: brightness(0.9); }

        /* 標題區域 - 純文字漸層不加底色 */
        .title-section { text-align: center; margin-bottom: 25px; padding: 15px; background: transparent !important; }
        .main-title-editable { font-size: 48px; font-weight: 900; outline: none; margin-bottom: 10px; color: var(--theme-accent); background: transparent !important; }
        #displayMainTitleText { display: inline-block; padding: 2px 4px; }
        .sub-title-editable { font-size: 24px; font-weight: bold; color: #666; outline: none; background: transparent !important; }

        /* 萬用可編輯表格與卡片樣式 */
        .editable-cell { outline: none; min-height: 40px; padding: 5px; border: 1px dashed transparent; transition: all 0.2s; border-radius: 4px; }
        .editable-cell:hover { border-color: rgba(0,0,0,0.12); }
        /* 正在編輯中的焦點樣式 - 不強制覆蓋背景色以免影響主標題漸層與自訂淡粉底色 */
        .active-editing-cell { border: 2px dashed #6B9AC4 !important; }

        /* 表格排版 - 標題不加實心底色，改為自然清爽線條 */
        .overview-print-wrapper { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; background-color: var(--theme-table-bg); margin-bottom: 15px; }
        table th, table td { border: 1.5px solid var(--theme-border); padding: 10px; vertical-align: top; text-align: left; }
        table th { background-color: transparent !important; color: var(--theme-accent); font-weight: bold; text-align: center; border-bottom: 2.5px solid var(--theme-main); font-size: 15px; }
        
        /* 第一頁專屬 */
        .overview-day-cell { height: 180px; position: relative; transition: background-color 0.2s; }
        .date-label { font-weight: bold; font-size: 14px; margin-bottom: 6px; color: var(--theme-accent); border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 3px; }
        .hotel-table th { background-color: transparent !important; color: var(--theme-accent); border-bottom: 2.5px solid var(--theme-accent); }

        /* 第二頁專屬 - 標題去除深色底色 */
        .itinerary-day-block { margin-bottom: 35px; background-color: var(--theme-table-bg); border: 1.5px solid var(--theme-border); border-radius: 8px; padding: 15px; page-break-inside: avoid; }
        .itinerary-day-title { font-size: 19px; font-weight: bold; color: var(--theme-accent); background-color: transparent !important; padding: 6px 5px 12px 5px; margin: 0 0 15px 0; border-bottom: 2px solid var(--theme-main); border-radius: 0; }
        .itinerary-table th { background-color: transparent !important; color: var(--theme-accent); border-bottom: 2px solid var(--theme-border); }
        .reference-section { background-color: rgba(0,0,0,0.015); border: 1px dashed var(--theme-border); padding: 15px; border-radius: 4px; }

        /* 第三頁 Checklist */
        .checklist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        .checklist-card { background-color: var(--theme-table-bg); border: 1.5px solid var(--theme-border); border-radius: 8px; padding: 15px; page-break-inside: avoid; }
        .checklist-category-title { font-size: 16px; font-weight: bold; color: var(--theme-accent); background-color: transparent !important; border-bottom: 2px solid var(--theme-main); padding-bottom: 6px; margin-top: 0; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .checklist-item-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 8px; position: relative; }
        .checklist-item-row:hover .delete-item-btn { display: inline-block; }
        .delete-item-btn { display: none; background: #FFCDD2; color: #C62828; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; cursor: pointer; line-height: 18px; text-align: center; padding: 0; margin-top: 2px; }

        /* 輔助工具 */
        .emoji-bar, .template-bar { display: flex; flex-wrap: wrap; gap: 6px; background: #FFFFFF; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--theme-border); margin-bottom: 10px; align-items: center; }
        .emoji-item { font-size: 19px; cursor: pointer; padding: 4px 7px; border-radius: 4px; transition: 0.15s; user-select: none; }
        .emoji-item:hover { background-color: var(--theme-bg); transform: scale(1.15); }
        .template-btn { background-color: #F0F4F8; color: #334E68; border: 1px solid #D9E2EC; padding: 6px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; transition: 0.15s; }
        .template-btn:hover { filter: brightness(0.95); transform: translateY(-1px); }

        /* 列印與匯出 */
        .no-print { display: block; }
        @media print {
            .no-print, .no-print * { display: none !important; }
            body { background-color: #FFFFFF !important; padding: 0 !important; margin: 0 !important; }
            .container { box-shadow: none !important; padding: 0 !important; max-width: 100% !important; }
            table { table-layout: fixed !important; width: 100% !important; }
            .overview-day-cell { height: auto !important; min-height: 120px !important; }
            .active-editing-cell { border: 1px dashed transparent !important; }
            .tab-content { display: none !important; }
            .tab-content.active { display: block !important; }
        }
    </style>
</head>
<body>

<input type="file" id="imageUploader" style="display:none;" accept="image/*" onchange="handleImageUpload(event)">

<div class="container">
    
    <div class="control-panel no-print">
        <div class="control-group">
            <label>1. 舒適自然主題：</label>
            <select onchange="applyTheme(this.value)">
                <option value="default">🌿 溫柔燕麥 (Default)</option>
                <option value="monochrome">☁️ 北歐極簡 (Minimalist)</option>
                <option value="playful">🌸 春日櫻粉 (Sakura)</option>
                <option value="forest">🌲 森林晨霧 (Forest)</option>
                <option value="ocean">🌊 微風淺海 (Ocean)</option>
                <option value="morandi">🎨 莫蘭迪暖灰 (Morandi)</option>
                <option value="artistic">🍂 秋日焦糖 (Caramel)</option>
                <option value="fashion">🪻 薰衣草莊園 (Lavender)</option>
            </select>
        </div>
        <div class="control-group" style="background:#FAF5EA; padding:5px 10px; border-radius:5px; border:1px solid #E6DEC8;">
            <label>2. 旅途區間：</label>
            <input type="date" id="baseStartDate" value="2026-04-29" onchange="onDateInputChange('start')">
            <span style="font-size:13px; font-weight:bold; color:var(--theme-accent);">至</span>
            <input type="date" id="baseEndDate" value="2026-05-04" onchange="onDateInputChange('end')">
        </div>
        <div class="control-group">
            <label>主標題文字漸層：</label>
            <select onchange="applyTitleGradient(this.value)">
                <option value="none">無漸層 (純色)</option>
                <option value="linear-gradient(45deg, #FF512F, #DD2476)">晚霞紅紫</option>
                <option value="linear-gradient(45deg, #1CB5E0, #000851)">深海冰藍</option>
                <option value="linear-gradient(45deg, #11998e, #38ef7d)">森林翠綠</option>
                <option value="linear-gradient(45deg, #C0392B, #8E44AD)">藝術油彩</option>
                <option value="linear-gradient(45deg, #D4AF37, #2C3E50)">時尚黑金</option>
                <option value="linear-gradient(45deg, #E8998D, #A16882)">玫瑰晨曦</option>
            </select>
        </div>
        <div class="control-group">
            <label>副標題顏色：</label>
            <input type="color" value="#666666" onchange="document.getElementById('displaySubTitle').style.color = this.value">
        </div>
        <div class="control-group" style="margin-left: auto; background: #fff; padding: 5px; border-radius: 5px; border: 1px solid #ddd; display: flex; gap: 5px;">
            <button class="export-btn" style="background-color: #C85A5A;" onclick="resetPlanner()">🔄 重新整理清空</button>
            <button class="export-btn" style="background-color: #4A8B71;" onclick="saveToLocal()">💾 儲存至 App</button>
            <select id="exportPageSize">
                <option value="a3-portrait">A3 縱向匯出</option>
                <option value="a4-portrait">A4 縱向匯出</option>
                <option value="a4-landscape">A4 橫向匯出</option>
            </select>
            <button class="export-btn" onclick="triggerPDFExport()">📥 PDF</button>
            <button class="export-btn" style="background-color: #4A6B9C;" onclick="triggerWordExport()">📥 WORD</button>
        </div>
    </div>

    <div class="format-toolbar no-print">
        <label style="color: #8C6239; font-size: 15px;">🖍️ 獨立內容與格子格式區：</label>
        <span style="font-size: 12px; color: #666;">(可<b>反白局部文字</b>或<b>點擊格子</b>獨立調整)</span>
        
        <div style="border-left: 2px solid #E6DEC8; padding-left: 15px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
            <label>文字顏色:</label>
            <input type="color" id="cellTextColorPicker" oninput="modifyActiveCell('color', this.value)" onchange="modifyActiveCell('color', this.value)">
            
            <label>字體大小:</label>
            <select onchange="modifyActiveCell('fontSize', this.value); this.selectedIndex=0;">
                <option value="" disabled selected>選擇大小...</option>
                <option value="default">還原預設</option>
                <option value="12px">12px (極小)</option>
                <option value="14px">14px (標準)</option>
                <option value="16px">16px (稍微放大)</option>
                <option value="18px">18px (中大)</option>
                <option value="20px">20px (大)</option>
                <option value="24px">24px (小標題級)</option>
                <option value="30px">30px (中標題級)</option>
                <option value="36px">36px (大標題級 +1)</option>
                <option value="42px">42px (特大標題 +2)</option>
                <option value="48px">48px (主標題級 +3)</option>
                <option value="56px">56px (超大海報級 +4)</option>
                <option value="64px">64px (巨無霸級 +5)</option>
            </select>

            <label>獨立字體:</label>
            <select onchange="modifyActiveCell('fontFamily', this.value); this.selectedIndex=0;">
                <option value="" disabled selected>選擇字體...</option>
                <option value="default">還原預設字體</option>
                <option value="'ZCOOL KuaiLe', sans-serif">快樂童趣體</option>
                <option value="'Ma Shan Zheng', cursive">手寫隨性體</option>
                <option value="'ZCOOL XiaoWei', serif">優雅文藝體</option>
                <option value="'Arial Rounded MT Bold', sans-serif">微軟圓體</option>
            </select>
            
            <button class="action-btn" style="background-color: #9C7A5B;" onmousedown="event.preventDefault()" onclick="toggleActiveCellWeight()"><b>粗體</b></button>
            <button class="action-btn" style="background-color: #9C7A5B;" onmousedown="event.preventDefault()" onclick="toggleActiveCellStyle()"><i>斜體</i></button>

            <span style="border-left: 2px solid #E6DEC8; padding-left: 12px; display: inline-flex; align-items: center; gap: 6px;">
                <label>🎨 獨立格子底色 (10款淡粉系)：</label>
                <select onchange="modifyActiveCell('backgroundColor', this.value); this.selectedIndex=0;">
                    <option value="" disabled selected>選擇淡粉底色...</option>
                    <option value="transparent">⚪ 預設透明 (無底色)</option>
                    <option value="#FDE8E8" style="background-color:#FDE8E8;">🌸 1. 櫻花粉 (Sakura Pink)</option>
                    <option value="#FFF0E5" style="background-color:#FFF0E5;">🍑 2. 蜜桃粉 (Peach Cream)</option>
                    <option value="#FDF9DE" style="background-color:#FDF9DE;">🍋 3. 奶油檸檬 (Butter Yellow)</option>
                    <option value="#E8F6EE" style="background-color:#E8F6EE;">🌿 4. 薄荷粉綠 (Mint Green)</option>
                    <option value="#EBF4FA" style="background-color:#EBF4FA;">💧 5. 迷霧粉藍 (Baby Blue)</option>
                    <option value="#F3ECF8" style="background-color:#F3ECF8;">🪻 6. 薰衣草粉紫 (Lavender)</option>
                    <option value="#F7EFE6" style="background-color:#F7EFE6;">🧋 7. 奶茶粉杏 (Milk Tea)</option>
                    <option value="#FDECE6" style="background-color:#FDECE6;">🪸 8. 珊瑚粉橘 (Coral Blush)</option>
                    <option value="#EDF2EB" style="background-color:#EDF2EB;">🍃 9. 鼠尾草粉綠 (Sage Mist)</option>
                    <option value="#F9E8F0" style="background-color:#F9E8F0;">🌷 10. 玫瑰粉紅 (Rose Quartz)</option>
                </select>
            </span>
        </div>
    </div>

    <div class="tab-navigation no-print">
        <button class="tab-btn active" id="btn-page1" onclick="switchActiveTab('page1')">第一頁：表格式行程總覽</button>
        <button class="tab-btn" id="btn-page2" onclick="switchActiveTab('page2')">第二頁：每日詳細行程表</button>
        <button class="tab-btn" id="btn-page3" onclick="switchActiveTab('page3')">第三頁：行李與物品 Check List</button>
    </div>

    <div id="dynamic-planner-core">
        
        <div class="title-section" id="print-title-area">
            <div id="displayMainTitle" class="main-title-editable editable-cell" contenteditable="true"><span id="displayMainTitleText">Magic Travel Planner</span></div>
            <div id="displaySubTitle" class="sub-title-editable editable-cell" contenteditable="true">在此輸入您的專屬行程副標題...</div>
        </div>

        <div id="tab-page1" class="tab-content active">
            <div class="no-print" style="margin-bottom: 15px;">
                <div class="emoji-bar">
                    <label>✨ 旅行小圖示 (先點格子再點圖示)：</label>
                    <span id="emojiList" style="display: flex; flex-wrap: wrap; gap: 2px;">
                        <!-- 交通 -->
                        <span class="emoji-item" title="自駕/租車" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚗')">🚗</span>
                        <span class="emoji-item" title="飛機/航班" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('✈️')">✈️</span>
                        <span class="emoji-item" title="高鐵/新幹線" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚄')">🚄</span>
                        <span class="emoji-item" title="火車/鐵道" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚆')">🚆</span>
                        <span class="emoji-item" title="地鐵/捷運" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚇')">🚇</span>
                        <span class="emoji-item" title="巴士/客運" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚌')">🚌</span>
                        <span class="emoji-item" title="計程車/Uber" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚕')">🚕</span>
                        <span class="emoji-item" title="渡輪/遊船" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('⛴️')">⛴️</span>
                        <span class="emoji-item" title="單車" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚲')">🚲</span>
                        <span class="emoji-item" title="纜車" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🚡')">🚡</span>
                        <!-- 住宿與放鬆 -->
                        <span class="emoji-item" title="酒店/住宿" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🏨')">🏨</span>
                        <span class="emoji-item" title="露營" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('⛺')">⛺</span>
                        <span class="emoji-item" title="溫泉/泡湯" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('♨️')">♨️</span>
                        <!-- 美食與餐飲 -->
                        <span class="emoji-item" title="便當/定食" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍱')">🍱</span>
                        <span class="emoji-item" title="拉麵/麵食" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍜')">🍜</span>
                        <span class="emoji-item" title="壽司/海鮮" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍣')">🍣</span>
                        <span class="emoji-item" title="燒肉/牛排" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🥩')">🥩</span>
                        <span class="emoji-item" title="火鍋/鍋物" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍲')">🍲</span>
                        <span class="emoji-item" title="咖啡廳/早午餐" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('☕')">☕</span>
                        <span class="emoji-item" title="甜點/下午茶" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍰')">🍰</span>
                        <span class="emoji-item" title="冰淇淋" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍦')">🍦</span>
                        <span class="emoji-item" title="居酒屋/小酌" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍺')">🍺</span>
                        <!-- 景點與活動 -->
                        <span class="emoji-item" title="拍照打卡" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('📸')">📸</span>
                        <span class="emoji-item" title="神社/鳥居" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('⛩️')">⛩️</span>
                        <span class="emoji-item" title="城堡/古蹟" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🏰')">🏰</span>
                        <span class="emoji-item" title="主題樂園" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🎡')">🎡</span>
                        <span class="emoji-item" title="地標鐵塔" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🗼')">🗼</span>
                        <span class="emoji-item" title="山岳/自然景觀" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🗻')">🗻</span>
                        <span class="emoji-item" title="賞櫻/花卉" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🌸')">🌸</span>
                        <span class="emoji-item" title="賞楓/秋葉" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('🍁')">🍁</span>
                        <span class="emoji-item" title="雪景/玩雪" onmousedown="event.preventDefault()" onclick="insertHtmlToFocused('❄️')">❄️</span>

<script>

        "藥品": ["噴鼻", "鼻敏感", "幸福傷風素", "消炎藥", "整腸丸", "化痰素", "止痛", "平安膏", "胃藥", "無比膏", "手 CREAM", "膠布", "鐵丸", "PIG 藥"],
        "衣物": ["睡衣", "輕便衣物", "紙底(男/女)", "長袖衫褲", "外套", "游泳衣", "泳鏡", "泳帽", "防滑雪抓"]
    };

    let activeCell = null;
    let savedRange = null;
    let currentActiveTab = 'page1';
    let deletedCategoriesStack = []; // 儲存被刪除的整張分類卡片紀錄

    window.onload = function() {
        const loaded = loadFromLocal();
        
        if (!loaded) {
            recalculateDates();
            renderChecklist();
        }
        
        document.addEventListener('click', function(e) {
            const cell = e.target.closest('.editable-cell') || (e.target.classList.contains('editable-cell') ? e.target : null);
            const td = e.target.closest('td.overview-day-cell');
            if (cell) {
                document.querySelectorAll('.editable-cell').forEach(c => c.classList.remove('active-editing-cell'));
                activeCell = cell;
                activeCell.classList.add('active-editing-cell');
                
                let currentColor = rgb2hex(activeCell.style.color);
                if (currentColor && document.getElementById('cellTextColorPicker')) {
                    document.getElementById('cellTextColorPicker').value = currentColor;
                }
            } else if (td) {
                const innerEditable = td.querySelector('.editable-cell');
                if (innerEditable) {
                    document.querySelectorAll('.editable-cell').forEach(c => c.classList.remove('active-editing-cell'));
                    activeCell = innerEditable;
                    activeCell.classList.add('active-editing-cell');
                }
            }
        });

        document.addEventListener('selectionchange', function() {
            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                const range = sel.getRangeAt(0);
                let container = range.commonAncestorContainer;
                if (container.nodeType === 3) container = container.parentNode;
                const editable = container.closest ? container.closest('.editable-cell') : null;
                if (editable) {
                    activeCell = editable;
                    document.querySelectorAll('.editable-cell').forEach(c => c.classList.remove('active-editing-cell'));
                    activeCell.classList.add('active-editing-cell');
                    if (!range.collapsed) {
                        savedRange = range.cloneRange();
                    } else {
                        savedRange = null;
                    }
                }
            }
        });
    };

    // ==================== LocalStorage 儲存與讀取邏輯 ====================
    function saveToLocal() {
        clearActiveCellOutline();
        
        document.querySelectorAll('#dynamic-planner-core input').forEach(input => {
            if (input.type === 'text' || input.type === 'date' || input.type === 'color') {
                input.setAttribute('value', input.value);
            } else if (input.type === 'checkbox' || input.type === 'radio') {
                if (input.checked) input.setAttribute('checked', 'checked');
                else input.removeAttribute('checked');
            }
        });
        document.querySelectorAll('#dynamic-planner-core select').forEach(select => {
            Array.from(select.options).forEach(opt => {
                if (opt.selected) opt.setAttribute('selected', 'selected');
                else opt.removeAttribute('selected');
            });
        });

        const saveData = {
            plannerHTML: document.getElementById('dynamic-planner-core').innerHTML,
            theme: document.querySelector('select[onchange="applyTheme(this.value)"]').value,
            startDate: document.getElementById('baseStartDate').value,
            endDate: document.getElementById('baseEndDate').value,
            titleGradient: document.querySelector('select[onchange="applyTitleGradient(this.value)"]').value,
            activeTab: currentActiveTab,
            deletedCategoriesStack: deletedCategoriesStack
        };
        
        localStorage.setItem('magicPlannerData', JSON.stringify(saveData));
        alert("🎉 進度已成功儲存至設備！\n下次打開此 App 時，將會自動還原您目前的內容。");
    }

    function loadFromLocal() {
        const savedDataStr = localStorage.getItem('magicPlannerData');
        if (savedDataStr) {
            try {
                const savedData = JSON.parse(savedDataStr);
                document.getElementById('dynamic-planner-core').innerHTML = savedData.plannerHTML;
                
                // 確保舊版紀錄中的主標題也有內層 span 以支援純文字漸層
                const titleEl = document.getElementById('displayMainTitle');
                if (titleEl && !document.getElementById('displayMainTitleText')) {
                    titleEl.innerHTML = `<span id="displayMainTitleText">${titleEl.innerHTML}</span>`;
                }

                // 相容性升級：確保載入的卡片都具備「恢復」與「刪除」雙按鈕及刪除紀錄功能
                upgradeExistingChecklistCards();
                if (savedData.deletedCategoriesStack) {
                    deletedCategoriesStack = savedData.deletedCategoriesStack;
                }

                if (savedData.theme && themes[savedData.theme]) {
                    document.querySelector('select[onchange="applyTheme(this.value)"]').value = savedData.theme;
                    applyTheme(savedData.theme);
                }
                if (savedData.startDate) document.getElementById('baseStartDate').value = savedData.startDate;
                if (savedData.endDate) document.getElementById('baseEndDate').value = savedData.endDate;
                if (savedData.titleGradient) {
                    const gradSelect = document.querySelector('select[onchange="applyTitleGradient(this.value)"]');
                    if (gradSelect) {
                        gradSelect.value = savedData.titleGradient;
                        applyTitleGradient(savedData.titleGradient);
                    }
                }
                if (savedData.activeTab) {
                    switchActiveTab(savedData.activeTab);
                }
                
                const subTitle = document.getElementById('displaySubTitle');
                if (subTitle && subTitle.style.color) {
                    document.querySelector('input[type="color"][onchange*="displaySubTitle"]').value = rgb2hex(subTitle.style.color);
                }
                return true;
            } catch (e) {
                console.error("載入失敗", e);
                return false;
            }
        }
        return false;
    }

    function resetPlanner() {
        if(confirm("⚠️ 確定要清空所有行程並還原為初始的空白狀態嗎？\n(注意：儲存過的內容將會永久遺失！)")) {
            localStorage.removeItem('magicPlannerData');
            location.reload();
        }
    }

    // ==================== 獨立內容與局部文字格式調整邏輯 ====================
    function rgb2hex(rgb) {
        if (!rgb || rgb.indexOf("rgb") === -1) return "#2c2c2c";
        rgb = rgb.match(/^rgb\((\d+),\s*(\d+),\s*(\d+)\)$/);
        function hex(x) { return ("0" + parseInt(x).toString(16)).slice(-2); }
        return rgb ? "#" + hex(rgb[1]) + hex(rgb[2]) + hex(rgb[3]) : "#2c2c2c";
    }

    function hasValidTextSelection() {
        const sel = window.getSelection();
        if (sel && sel.rangeCount > 0 && !sel.getRangeAt(0).collapsed) {
            const range = sel.getRangeAt(0);
            let container = range.commonAncestorContainer;
            if (container.nodeType === 3) container = container.parentNode;
            if (container.closest && container.closest('.editable-cell')) {
                savedRange = range.cloneRange();
                return true;
            }
        }
        if (savedRange && !savedRange.collapsed && activeCell && activeCell.contains(savedRange.commonAncestorContainer)) {
            return true;
        }
        return false;
    }

    function applyStyleToSelection(styleProperty, value) {
        if (!savedRange) return;
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(savedRange);

        const range = sel.getRangeAt(0);
        if (range.collapsed) return;

        let parentEl = range.commonAncestorContainer;
        if (parentEl.nodeType === 3) parentEl = parentEl.parentNode;
        if (parentEl && parentEl.tagName === 'SPAN' && parentEl.id !== 'displayMainTitleText' && !parentEl.classList.contains('editable-cell') && parentEl.innerText === range.toString()) {
            parentEl.style[styleProperty] = (value === 'default') ? '' : value;
            savedRange = range.cloneRange();
            return;
        }

        const span = document.createElement('span');
        span.style[styleProperty] = (value === 'default') ? '' : value;

        const fragment = range.extractContents();
        fragment.querySelectorAll('*').forEach(el => {
            if (el.style && el.style[styleProperty]) {
                el.style[styleProperty] = '';
            }
        });
        span.appendChild(fragment);
        range.insertNode(span);

        const newRange = document.createRange();
        newRange.selectNodeContents(span);
        sel.removeAllRanges();
        sel.addRange(newRange);
        savedRange = newRange.cloneRange();
    }

    function modifyActiveCell(styleProperty, value) {
        if (!activeCell) {
            alert('💡 請先點擊下方的任何一個格子，或反白選取文字，再來使用此排版工具！');
            return;
        }
        if (styleProperty === 'backgroundColor') {
            if (activeCell.id === 'displayMainTitle' || activeCell.id === 'displaySubTitle') {
                return alert('💡 主副標題保持無底色設計，請點選下方的行程表格或卡片來更改格子底色！');
            }
            const parentTd = activeCell.closest('td');
            if (parentTd) {
                parentTd.style.backgroundColor = value;
                activeCell.style.backgroundColor = 'transparent';
            } else {
                activeCell.style.backgroundColor = value;
            }
            return;
        }

        if (styleProperty === 'color' && activeCell.id === 'displayMainTitle' && !hasValidTextSelection()) {
            const titleTextSpan = document.getElementById('displayMainTitleText');
            if (titleTextSpan) {
                titleTextSpan.style.backgroundImage = 'none';
                titleTextSpan.style.webkitBackgroundClip = 'initial';
                titleTextSpan.style.webkitTextFillColor = 'initial';
                titleTextSpan.style.color = value;
            }
            activeCell.style.color = value;
            return;
        }

        if (hasValidTextSelection()) {
            applyStyleToSelection(styleProperty, value);
        } else {
            activeCell.style[styleProperty] = (value === 'default') ? '' : value;
        }
    }

    function toggleActiveCellWeight() {
        if (!activeCell) return alert('請先點擊要修改的文字格子或反白選取文字！');
        if (hasValidTextSelection()) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
            document.execCommand('bold', false, null);
            if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
        } else {
            activeCell.style.fontWeight = (activeCell.style.fontWeight === 'bold') ? 'normal' : 'bold';
        }
    }

    function toggleActiveCellStyle() {
        if (!activeCell) return alert('請先點擊要修改的文字格子或反白選取文字！');
        if (hasValidTextSelection()) {
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(savedRange);
            document.execCommand('italic', false, null);
            if (sel.rangeCount > 0) savedRange = sel.getRangeAt(0).cloneRange();
        } else {
            activeCell.style.fontStyle = (activeCell.style.fontStyle === 'italic') ? 'normal' : 'italic';
        }
    }

    // ==================== 日期計算與遠期區間修復邏輯 ====================
    function parseDateLocal(dateStr) {
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length !== 3) return null;
        const y = parseInt(parts[0], 10);
        const m = parseInt(parts[1], 10) - 1;
        const d = parseInt(parts[2], 10);
        if (isNaN(y) || isNaN(m) || isNaN(d) || y < 1900 || y > 2100) return null;
        return new Date(y, m, d, 0, 0, 0, 0);
    }

    function formatDateInput(dateObj) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function onDateInputChange(changedType) {
        const startInput = document.getElementById('baseStartDate');
        const endInput = document.getElementById('baseEndDate');
        let startDate = parseDateLocal(startInput.value);
        let endDate = parseDateLocal(endInput.value);

        if (!startDate || !endDate) return;

        if (changedType === 'start' && endDate < startDate) {
            endDate = new Date(startDate);
            endDate.setDate(startDate.getDate() + 5);
            endInput.value = formatDateInput(endDate);
        } else if (changedType === 'end' && endDate < startDate) {
            startDate = new Date(endDate);
            startInput.value = formatDateInput(startDate);
        }

        recalculateDates();
    }

    function recalculateDates() {
        const startInputStr = document.getElementById('baseStartDate').value || '2026-04-29';
        const endInputStr = document.getElementById('baseEndDate').value || '2026-05-04';
        
        let tripStartDate = parseDateLocal(startInputStr);
        let tripEndDate = parseDateLocal(endInputStr);
        
        if (!tripStartDate) tripStartDate = new Date(2026, 3, 29);
        if (!tripEndDate) tripEndDate = new Date(2026, 4, 4);

        if (tripEndDate < tripStartDate) {
            tripEndDate = new Date(tripStartDate);
            tripEndDate.setDate(tripStartDate.getDate() + 5); 
            document.getElementById('baseEndDate').value = formatDateInput(tripEndDate);
        }

        let diffTime = tripEndDate.getTime() - tripStartDate.getTime();
        let totalDays = Math.round(diffTime / (1000 * 3600 * 24)) + 1;

        if (totalDays > 180) {
            alert('⚠️ 偵測到旅途區間超過 180 天！系統已自動將回程日期調整為出發日後 30 天，您可再微調回程日期。');
            tripEndDate = new Date(tripStartDate);
            tripEndDate.setDate(tripStartDate.getDate() + 29);
            document.getElementById('baseEndDate').value = formatDateInput(tripEndDate);
            totalDays = 30;
        }
        
        const dayOfWeek = tripStartDate.getDay();
        const calendarStartDate = new Date(tripStartDate);
        calendarStartDate.setDate(tripStartDate.getDate() - dayOfWeek);

        const tbody = document.getElementById('overviewTableBody');
        tbody.innerHTML = '';
        let row = document.createElement('tr');
        
        let totalCellsNeeded = dayOfWeek + totalDays;
        let weeksToShow = Math.max(2, Math.ceil(totalCellsNeeded / 7));
        let totalCells = weeksToShow * 7;
        
        for(let i = 0; i < totalCells; i++) {
            if (i > 0 && i % 7 === 0) { tbody.appendChild(row); row = document.createElement('tr'); }
            
            let currentCellDate = new Date(calendarStartDate);
            currentCellDate.setDate(calendarStartDate.getDate() + i);
            
            let m = currentCellDate.getMonth() + 1;
            let d = currentCellDate.getDate();
            let dateLabel = `${m}/${d}`;

            let cellDiffTime = currentCellDate.getTime() - tripStartDate.getTime();
            let diffDays = Math.round(cellDiffTime / (1000 * 3600 * 24));
            
            let cellContent = "";
            let bgColor = "transparent";
            
            if (diffDays >= 0 && diffDays < totalDays) {
                let presetText = presetItineraryTexts[diffDays] || `(第 ${diffDays + 1} 天行程)\n點此輸入內容...`;
                cellContent = presetText.replace(/\n/g, '<br>');
                bgColor = softPastelPalette[diffDays % softPastelPalette.length];
            }

            const td = document.createElement('td');
            td.className = 'overview-day-cell';
            td.style.backgroundColor = bgColor;
            td.innerHTML = `<div class="date-label">${dateLabel}</div><div class="cell-content editable-cell" contenteditable="true">${cellContent}</div>`;
            row.appendChild(td);
        }
        tbody.appendChild(row);

        const itineraryContainer = document.getElementById('detailedItineraryContainer');
        itineraryContainer.innerHTML = '';
        const weekdaysText = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

        for(let j = 0; j < totalDays; j++) {
            let detailDate = new Date(tripStartDate);
            detailDate.setDate(tripStartDate.getDate() + j);
            let y = detailDate.getFullYear();
            let m = detailDate.getMonth() + 1;
            let d = detailDate.getDate();
            let w = weekdaysText[detailDate.getDay()];
            let fullDateStr = `${y}/${m}/${d} (${w})`;

            let titleContent = presetItineraryTexts[j] ? presetItineraryTexts[j].split('\n')[0].replace('★ ', '') : '點此輸入行程景點...';

            itineraryContainer.innerHTML += `
                <div class="itinerary-day-block">
                    <div class="itinerary-day-title editable-cell" contenteditable="true">📆 ${fullDateStr} - 第 ${j+1} 天詳細行程</div>
                    <table class="itinerary-table">
                        <tr><th width="15%">時間</th><th width="35%">行程與景點</th><th width="15%">交通</th><th width="15%">住宿</th><th width="20%">備註</th></tr>
                        <tr>
                            <td><div class="editable-cell" contenteditable="true" style="font-weight:bold;">09:00 AM</div></td>
                            <td><div class="editable-cell" contenteditable="true">${titleContent}</div></td>
                            <td><div class="editable-cell" contenteditable="true">點此輸入交通...</div></td>
                            <td><div class="editable-cell" contenteditable="true">飯店名稱</div></td>
                            <td><div class="editable-cell" contenteditable="true">輸入筆記</div></td>
                        </tr>
                    </table>
                    <div class="reference-section"><div class="editable-cell" contenteditable="true">📂 參考資料與相片擴充區 (點擊此處後，使用上方「上傳相片」按鈕插入照片)...</div></div>
                </div>`;
        }
        
        updateHotelDates();
    }

    function updateHotelDates() {
        const startInputStr = document.getElementById('baseStartDate').value || '2026-04-29';
        const startDate = parseDateLocal(startInputStr) || new Date(2026, 3, 29);
        const rows = document.querySelectorAll('#hotelTableBody tr');
        let currentDate = new Date(startDate);

        rows.forEach(row => {
            const daysCell = row.cells[0].querySelector('.editable-cell');
            const datesCell = row.cells[1].querySelector('.editable-cell');
            
            let match = daysCell.innerText.match(/\d+/);
            let days = match ? parseInt(match[0]) : 1;
            
            let startStr = `${currentDate.getFullYear()}/${(currentDate.getMonth()+1).toString().padStart(2, '0')}/${currentDate.getDate().toString().padStart(2, '0')}`;
            
            currentDate.setDate(currentDate.getDate() + days);
            
            let endStr = `${(currentDate.getMonth()+1).toString().padStart(2, '0')}/${currentDate.getDate().toString().padStart(2, '0')}`;
            
            if(days === 1) {
                datesCell.innerText = `${startStr}`;
            } else {
                datesCell.innerText = `${startStr} ~ ${endStr}`;
            }
        });
    }

        }

    // 刪除單一物品項目並記錄到該卡片的歷史堆疊中
    function deleteChecklistItem(btn) {
        const li = btn.closest('.checklist-item-row');
        const card = btn.closest('.checklist-card');
        if (!li || !card) return;

        // 同步保存打勾狀態
        const checkbox = li.querySelector('input[type="checkbox"]');
        if (checkbox) {
            if (checkbox.checked) checkbox.setAttribute('checked', 'checked');
            else checkbox.removeAttribute('checked');
        }

        const ul = card.querySelector('ul');
        const index = Array.from(ul.children).indexOf(li);

        let stack = [];
        try { stack = JSON.parse(card.getAttribute('data-deleted-items') || '[]'); } catch(e) { stack = []; }
        stack.push({ html: li.outerHTML, index: index });
        card.setAttribute('data-deleted-items', JSON.stringify(stack));

        li.remove();
    }

    // 恢復該分類卡片中被刪除的物品項目
    function restoreChecklistItem(btn) {
        const card = btn.closest('.checklist-card');
        if (!card) return;

        let stack = [];
        try { stack = JSON.parse(card.getAttribute('data-deleted-items') || '[]'); } catch(e) { stack = []; }

        const ul = card.querySelector('ul');

        if (stack.length > 0) {
            const lastDeleted = stack.pop();
            card.setAttribute('data-deleted-items', JSON.stringify(stack));

            const temp = document.createElement('div');
            temp.innerHTML = lastDeleted.html;
            const restoredLi = temp.firstElementChild;

            const delBtn = restoredLi.querySelector('.delete-item-btn');
            if (delBtn) delBtn.setAttribute('onclick', 'deleteChecklistItem(this)');

            if (lastDeleted.index >= 0 && lastDeleted.index < ul.children.length) {
                ul.insertBefore(restoredLi, ul.children[lastDeleted.index]);
            } else {
                ul.appendChild(restoredLi);
            }
        } else {
            // 若無單項刪除紀錄，檢查是否為預設分類並自動補回缺少的預設項目
            const titleSpans = card.querySelectorAll('.checklist-category-title .editable-cell');
            const catName = titleSpans.length > 0 ? titleSpans[0].innerText.trim() : '';
            if (fullChecklistData[catName]) {
                const currentItems = Array.from(ul.querySelectorAll('.editable-cell')).map(el => el.innerText.trim());
                const missingItems = fullChecklistData[catName].filter(item => !currentItems.includes(item));
                if (missingItems.length > 0) {
                    missingItems.forEach(item => {
                        ul.insertAdjacentHTML('beforeend', `
                            <li class="checklist-item-row">
                                <input type="checkbox">
                                <span class="editable-cell" contenteditable="true" style="flex-grow:1; min-height:20px;">${item}</span>
                                <button class="delete-item-btn no-print" onclick="deleteChecklistItem(this)">✖</button>
                            </li>
                        `);
                    });
                    return;
                }
            }
            alert('💡 此分類目前沒有已刪除的項目可供恢復！');
        }
    }

    // 刪除整張分類卡片並記錄，以便隨時恢復
    function deleteChecklistCategory(btn) {
        const card = btn.closest('.checklist-card');
        const container = document.getElementById('checklistGridContainer');

        card.querySelectorAll('input[type="checkbox"]').forEach(cb => {

        });

        const index = Array.from(container.children).indexOf(card);
        deletedCategoriesStack.push({ html: card.outerHTML, index: index });
        card.remove();
    }

    // 恢復剛剛刪除的整張分類卡片
    function restoreChecklistCategory() {
        if (deletedCategoriesStack.length === 0) {

        const lastDeleted = deletedCategoriesStack.pop();

        const restoredCard = temp.firstElementChild;

        if (lastDeleted.index >= 0 && lastDeleted.index < container.children.length) {
            container.insertBefore(restoredCard, container.children[lastDeleted.index]);
        } else {
            container.appendChild(restoredCard);
        }
    }

                    t.style.borderBottom = '1px solid #888';
                });
                
                elementToExport.querySelectorAll('.checklist-item-row').forEach(r => { 
                    r.style.fontSize = '11px'; 
                    r.style.marginBottom = '0px'; 
                    r.style.lineHeight = '1.1'; 
                });

                elementToExport.querySelectorAll('.editable-cell').forEach(cell => {
                    cell.style.padding = '0px';
                    cell.style.minHeight = '14px';
                });

                const titleArea = elementToExport.querySelector('#print-title-area');
                if (titleArea) {
                    titleArea.style.padding = '2px';
                    titleArea.style.marginBottom = '4px';
                    const mainTitle = titleArea.querySelector('.main-title-editable');
                    const subTitle = titleArea.querySelector('.sub-title-editable');
                    if (mainTitle) { mainTitle.style.fontSize = '20px'; mainTitle.style.marginBottom = '2px'; }
                    if (subTitle) { subTitle.style.fontSize = '12px'; }
                }
            }
        }

        const opt = { 
            margin: [10, 10, 10, 10], 
            filename: `MagicTravelPlanner_${currentActiveTab}.pdf`, 
            image: { type: 'jpeg', quality: 0.98 }, 
            html2canvas: { scale: 2, useCORS: true }, 
            jsPDF: { unit: 'mm', format: targetSize, orientation: targetOrientation } 
        };
        html2pdf().set(opt).from(elementToExport).save();
    }

    function triggerWordExport() {
        clearActiveCellOutline();
        const clone = document.getElementById('dynamic-planner-core').cloneNode(true);
        clone.querySelectorAll('.no-print').forEach(el => el.remove());
        clone.querySelectorAll('.tab-content').forEach(tab => { if (!tab.classList.contains('active')) tab.remove(); });

        const styles = Array.from(document.querySelectorAll('style')).map(s => s.outerHTML).join('\n');

        const blobContent = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
        <head>
            <meta charset='utf-8'>
            <title>Export</title>
            ${styles}
            <style>
                table { border-collapse: collapse; width: 100%; margin-bottom: 20px; }
                th, td { border: 1px solid #DCD7CC; padding: 8px; text-align: left; vertical-align: top; }
                th { background-color: transparent; color: #5C5346; font-weight: bold; border-bottom: 2px solid #7C9082; }
                .itinerary-day-title { background-color: transparent; color: #5C5346; padding: 8px 0; font-weight: bold; font-size: 16px; margin-bottom: 8px; border-bottom: 2px solid #7C9082; }
                .checklist-card { border: 1px solid #DCD7CC; margin-bottom: 15px; padding: 10px; }
                .checklist-category-title { border-bottom: 2px solid #7C9082; color: #5C5346; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
                .checklist-item-row { margin-bottom: 5px; }
                body { font-family: 'PingFang HK', 'Microsoft JhengHei', sans-serif; }
            </style>
        </head>
        <body>${clone.innerHTML}</body>
        </html>`;
        
        const blob = new Blob(['\ufeff' + blobContent], { type: 'application/msword' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `MagicTravelPlanner_${currentActiveTab}.doc`;
        document.body.appendChild(a); 
        a.click(); 
        document.body.removeChild(a);
    }
</script>
</body>
</html>
